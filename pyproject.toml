[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-tools-deepkeep"
version = "0.1.0"
description = "DeepKeep AI Firewall tools for CrewAI agents — check inputs, create conversations, and call the DeepKeep API."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "DeepKeep", email = "support@deepkeep.ai" }]
keywords = ["crewai", "tools", "ai-agents", "deepkeep", "firewall", "guardrails", "llm-security", "ai-safety"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.80.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "responses>=0.25",   # HTTP mocking for tests
    "ruff>=0.4",
    "black>=24.0",
]

[project.urls]
Homepage    = "https://deepkeep.ai"
Repository  = "https://github.com/Deepkeepai/crewai-tools-deepkeep"
Documentation = "https://github.com/Deepkeepai/crewai-tools-deepkeep#readme"
Issues      = "https://github.com/Deepkeepai/crewai-tools-deepkeep/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_tools_deepkeep"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
